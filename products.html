<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products | Star Agencies</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Products CSS -->
    <link rel="stylesheet" href="css/products.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="site-header">

        <div class="container navbar">

            <a href="index.html" class="brand">

                <img
                    src="logo.jpg"
                    alt="Star Agencies Logo"
                >

                <span>STAR AGENCIES</span>

            </a>


            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="products.html" class="active">
                    Products
                </a>

                <a href="about.html">
                    About
                </a>

                <a href="contact.html">
                    Contact
                </a>

            </nav>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main>

        <!-- PAGE BANNER -->

        <section class="page-banner">

            <div class="container">

                <span class="eyebrow">
                    OUR CATALOGUE
                </span>

                <h1>
                    Products
                </h1>

                <p>
                    Browse our products
                </p>

            </div>

        </section>


        <!-- PRODUCTS SECTION -->

        <section class="products-section">

            <div class="container">


                <!-- SEARCH + FILTER -->

                <div class="catalogue-tools">


                    <!-- SEARCH -->

                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Search products..."
                        aria-label="Search products"
                    >


                    <!-- CATEGORY FILTERS -->

                    <div class="filter-buttons">


                        <button
                            class="filter-btn active"
                            data-category="All"
                        >
                            All
                        </button>


                        <button
                            class="filter-btn active"
                            data-category="Stationery Product"
                        >
                            Stationery
                        </button>


                        <button
                            class="filter-btn"
                            data-category="Plastic Products"
                        >
                            Plastic
                        </button>


                        <button
                            class="filter-btn"
                            data-category="Cleaning Items"
                        >
                            Cleaning
                        </button>


                        <button
                            class="filter-btn"
                            data-category="Aluminium & Steel"
                        >
                            Aluminium &amp; Steel
                        </button>


                        <button
                            class="filter-btn"
                            data-category="Household"
                        >
                            Household
                        </button>


                    </div>

                </div>


                <!-- ================= PRODUCTS ================= -->

                <!-- Products will be loaded from products.json -->

                <div
                    class="products-grid"
                    id="productsContainer"
                >
                </div>


                <!-- NO RESULTS -->

                <p
                    id="noResults"
                    hidden
                >
                    No products found.
                </p>


            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="site-footer">

        <div class="container">

            <p>
                © 2026 Star Agencies. All rights reserved.
            </p>

        </div>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="js/products.js"></script>

</body>

</html>
