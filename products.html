<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Star Agencies</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/products.css">

    <style>
        .page-banner { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; text-align: center; padding: 70px 20px; border-radius: 0 0 40px 40px; margin-bottom: 50px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1); }
        .page-banner .eyebrow { color: #fbbf24; font-weight: 700; letter-spacing: 3px; font-size: 13px; display: block; margin-bottom: 15px; text-transform: uppercase; }
        .page-banner h1 { font-size: clamp(32px, 5vw, 46px); margin: 0 0 15px 0; font-weight: 800; color: #ffffff; }
        .page-banner p { font-size: 16px; color: #94a3b8; max-width: 600px; margin: 0 auto; line-height: 1.6; }

        .catalogue-tools { max-width: 900px; margin: 0 auto 40px; display: flex; gap: 15px; }
        .search-box { flex: 2; position: relative; }
        .category-box { flex: 1; position: relative; }

        #searchInput, #categoryDropdown { width: 100%; padding: 16px 25px; font-size: 15px; border: 2px solid #e2e8f0; border-radius: 50px; outline: none; box-shadow: 0 4px 20px rgba(0,0,0,0.04); transition: all 0.3s ease; background: #ffffff; color: #1e293b; font-family: inherit; }
        #searchInput:focus, #categoryDropdown:focus { border-color: #0b5ed7; box-shadow: 0 4px 20px rgba(11, 94, 215, 0.15); }
        
        #categoryDropdown { cursor: pointer; appearance: none; font-weight: 600; color: #0f172a; }
        .dropdown-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); pointer-events: none; }

        @media (max-width: 768px) { .catalogue-tools { flex-direction: column; gap: 15px; } }

        .products-grid { display: grid; grid-template-columns: repeat(4, 1fr) !important; gap: 20px; padding: 10px 0 30px; width: 100%; }
        @media (max-width: 1100px) { .products-grid { grid-template-columns: repeat(3, 1fr) !important; } }
        @media (max-width: 850px) { .products-grid { grid-template-columns: repeat(2, 1fr) !important; } }
        @media (max-width: 500px) { .products-grid { grid-template-columns: 1fr !important; } }

        .product-card { background: #ffffff; border-radius: 16px; border: 1px solid #f1f5f9 !important; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); overflow: hidden; transition: all 0.3s ease; position: relative; display: flex; flex-direction: column; height: 100%; }
        .product-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #0b5ed7, #10b981, #f59e0b, #ef4444); }
        .product-card:hover { transform: translateY(-6px); box-shadow: 0 12px 30px rgba(11, 94, 215, 0.12); border-color: #cbd5e1 !important; }
        .product-image { width: 100%; height: 180px; object-fit: contain; padding: 20px; background: radial-gradient(circle, #ffffff 0%, #f8fafc 100%); border-bottom: 1px solid #f1f5f9; }
        .product-info { padding: 18px; flex-grow: 1; display: flex; flex-direction: column; }

        #scrollTopBtn { position: fixed; bottom: 30px; right: 30px; z-index: 999; border: none; outline: none; background: linear-gradient(135deg, #0b5ed7, #10b981); color: white; cursor: pointer; width: 50px; height: 50px; border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.25); transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; }
        #scrollTopBtn.show { opacity: 1; visibility: visible; }
        #scrollTopBtn:hover { transform: translateY(-5px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        @media (max-width: 768px) { #scrollTopBtn { bottom: 20px; right: 20px; width: 45px; height: 45px; } }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="container navbar">
            <a href="index.html" class="brand">
                <img src="images/logo.jpg" alt="Star Agencies Logo">
                <span style="font-family: 'Century Gothic', sans-serif; font-weight: bold; letter-spacing: 1px;">STAR AGENCIES</span>
            </a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html" class="active">Products</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-banner">
            <div class="container">
                <span class="eyebrow">OUR CATALOGUE</span>
                <h1>Explore Our Products</h1>
                <p>Find the best quality household, cleaning, plastic, hardware, and stationery items for your everyday needs.</p>
            </div>
        </section>

        <section class="products-section">
            <div class="container">
                <div class="catalogue-tools">
                    <div class="search-box">
                        <input type="search" id="searchInput" placeholder="Search for products or brands..." aria-label="Search products">
                    </div>
                    
                    <div class="category-box">
                        <select id="categoryDropdown" onchange="handleCategoryChange(this.value)">
                            <option value="All">View All Categories</option>
                            <option value="Plastic Products">🟢 Plastic Products</option>
                            <option value="Bucket">&nbsp;&nbsp;&nbsp;↳ Buckets</option>
                            <option value="Basin">&nbsp;&nbsp;&nbsp;↳ Basins</option>
                            <option value="Drum">&nbsp;&nbsp;&nbsp;↳ Drums</option>
                            <option value="Container">&nbsp;&nbsp;&nbsp;↳ Containers</option>
                            <option value="Laundry">&nbsp;&nbsp;&nbsp;↳ Laundry Products</option>
                            <option value="Household">&nbsp;&nbsp;&nbsp;↳ Household Items</option>
                            
                            <option value="Cleaning Items">🧹 Cleaning Items</option>
                            <option value="Mop">&nbsp;&nbsp;&nbsp;↳ Mops</option>
                            <option value="Brush">&nbsp;&nbsp;&nbsp;↳ Brushes</option>
                            <option value="Broom">&nbsp;&nbsp;&nbsp;↳ Brooms</option>
                            <option value="Disinfectant">&nbsp;&nbsp;&nbsp;↳ Disinfectants</option>

                            <option value="Stationery Items">✏️ Stationery Items</option>
                            <option value="Aluminium & Steel">🪣 Aluminium & Steel</option>
                            <option value="Hardware Items">🔧 Hardware Items</option>
                        </select>
                        <div class="dropdown-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                        </div>
                    </div>
                </div>

                <div class="products-grid" id="productsContainer"></div>

                <p id="noResults" hidden style="text-align: center; color: #64748b; font-size: 16px; margin-top: 40px;">
                    No products found matching your search.
                </p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© 2026 Star Agencies. All rights reserved.</p>
        </div>
    </footer>

    <button id="scrollTopBtn" onclick="scrollToTop()" title="Go to top">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>

    <script src="js/products.js"></script>
    <script>
        const scrollTopBtn = document.getElementById("scrollTopBtn");
        window.addEventListener("scroll", () => {
            if (window.scrollY > 300) scrollTopBtn.classList.add("show");
            else scrollTopBtn.classList.remove("show");
        });
        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
    </script>
</body>
</html>
