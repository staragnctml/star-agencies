<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products | Star Agencies</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Products CSS -->
    <link rel="stylesheet" href="css/products.css">

    <!-- Plastic Dropdown Styling -->
    <style>
        .filter-dropdown {
            position: relative;
            display: inline-block;
        }
        .filter-dropdown-content {
            display: none;
            position: absolute;
            background-color: #ffffff;
            min-width: 190px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.15);
            z-index: 1000;
            border-radius: 8px;
            overflow: hidden;
            top: 100%;
            left: 0;
            margin-top: 5px;
            text-align: left;
            border: 1px solid #cbd5e1;
        }
        .filter-dropdown-content button {
            width: 100%;
            padding: 10px 15px;
            border: none;
            background: none;
            color: #1e293b;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 1px solid #f1f5f9;
            transition: 0.2s;
        }
        .filter-dropdown-content button:hover {
            background-color: #f8fafc;
            color: #0b5ed7;
            padding-left: 18px;
        }
        .filter-dropdown:hover .filter-dropdown-content {
            display: block;
        }
    </style>
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="site-header">
        <div class="container navbar">
            <a href="index.html" class="brand">
                <img src="images/logo.jpg" alt="Star Agencies Logo">
                <span>STAR AGENCIES</span>
            </a>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html" class="active">Products</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>


    <!-- ================= MAIN ================= -->
    <main>

        <!-- PAGE BANNER -->
        <section class="page-banner">
            <div class="container">
                <span class="eyebrow">OUR CATALOGUE</span>
                <h1>Products</h1>
                <p>Browse our products</p>
            </div>
        </section>


        <!-- PRODUCTS SECTION -->
        <section class="products-section">
            <div class="container">

                <!-- SEARCH + FILTER -->
                <div class="catalogue-tools">

                    <!-- SEARCH -->
                    <input type="search" id="searchInput" placeholder="Search products..." aria-label="Search products">

                    <!-- CATEGORY FILTERS -->
                    <div class="filter-buttons">

                        <button class="filter-btn active" data-category="All">All</button>
                        <button class="filter-btn" data-category="Stationery Items">Stationery</button>

                        <!-- Plastic Dropdown Menu -->
                        <div class="filter-dropdown">
                            <button class="filter-btn filter-dropdown-btn" data-category="Plastic Products">
                                Plastic ▼
                            </button>
                            <div class="filter-dropdown-content">
                                <!-- 's' ഒഴിവാക്കി കൃത്യമായ പേരുകൾ കൊടുത്തു -->
                                <button onclick="selectPlasticSub('Bucket')">Bucket</button>
                                <button onclick="selectPlasticSub('Basin')">Basins</button>
                                <button onclick="selectPlasticSub('Drum')">Drums</button>
                                <button onclick="selectPlasticSub('Container')">Containers</button>
                                <button onclick="selectPlasticSub('Laundry')">Laundry Products</button>
                            </div>
                        </div>

                        <button class="filter-btn" data-category="Cleaning Items">Cleaning</button>
                        <button class="filter-btn" data-category="Aluminium & Steel">Aluminium &amp; Steel</button>
                        <button class="filter-btn" data-category="Household">Household</button>

                    </div>
                </div>

                <!-- PRODUCTS GRID -->
                <div class="products-grid" id="productsContainer"></div>

                <!-- NO RESULTS -->
                <p id="noResults" hidden>No products found.</p>

            </div>
        </section>

    </main>


    <!-- ================= FOOTER ================= -->
    <footer class="site-footer">
        <div class="container">
            <p>© 2026 Star Agencies. All rights reserved.</p>
        </div>
    </footer>


    <!-- ================= JAVASCRIPT ================= -->
    <script src="js/products.js"></script>

    <script>
        // Sub-category search helper for plastic items
        function selectPlasticSub(subName) {
            // 1. സെർച്ച് ബോക്സിൽ പേര് കൊടുക്കുന്നു
            const searchInput = document.getElementById("searchInput");
            if (searchInput) {
                searchInput.value = subName;
            }
            
            // 2. ഓട്ടോമാറ്റിക് ആയി "Plastic Products" ബട്ടൺ ക്ലിക്ക് ചെയ്യപ്പെടുന്നു (അതോടെ കൃത്യമായി ഫിൽറ്റർ ആകും)
            const plasticBtn = document.querySelector('[data-category="Plastic Products"]');
            if (plasticBtn) {
                plasticBtn.click(); 
            } else if (searchInput) {
                searchInput.dispatchEvent(new Event('input'));
            }
        }
    </script>

</body>
</html>
