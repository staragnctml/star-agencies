<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Star Agencies</title>
    
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ===================================================
           CENTURY GOTHIC FONT OVERRIDE FOR STAR AGENCIES
           =================================================== */
        .brand span {
            font-family: 'Century Gothic', 'Tw Cen MT', sans-serif !important;
            font-weight: bold !important;
            letter-spacing: 1px !important;
        }

        /* ===================================================
           MODERN RIGHT-ALIGNED HERO SECTION
           =================================================== */
        .hero {
            position: relative;
            /* നിങ്ങളുടെ ബാക്ക്ഗ്രൗണ്ട് ഇമേജ് ലിങ്ക് (മാറ്റങ്ങൾ ഉണ്ടെങ്കിൽ ഇവിടെ തിരുത്താം) */
            background-image: url('images/hero-bg.jpg'); 
            background-size: cover;
            background-position: center left;
            min-height: 85vh;
            display: flex;
            align-items: center;
            /* അക്ഷരങ്ങളെ പൂർണ്ണമായും വലതുവശത്തേക്ക് മാറ്റാൻ */
            justify-content: flex-end; 
            padding: 0 8%;
            overflow: hidden;
        }

        /* Modern Gradient: ഇടതുവശം ക്ലിയർ ആക്കാനും വലതുവശം ഡാർക്ക് ആക്കാനും */
        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to right, rgba(15, 23, 42, 0.05) 0%, rgba(15, 23, 42, 0.4) 40%, rgba(15, 23, 42, 0.95) 100%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 650px;
            /* ടെക്സ്റ്റ് റൈറ്റ് അലൈൻ ചെയ്യാൻ */
            text-align: right; 
        }

        .hero-subtitle {
            color: #fbbf24;
            font-weight: 700;
            letter-spacing: 4px;
            font-size: 14px;
            display: block;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .hero-title {
            font-size: clamp(40px, 5vw, 65px);
            margin: 0 0 20px 0;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.1;
        }

        .hero-title .highlight {
            color: #ef4444; /* Quality എന്നതിന് ചുവപ്പ് നിറം */
        }

        .hero-desc {
            font-size: 18px;
            color: #cbd5e1;
            margin: 0 0 35px 0;
            line-height: 1.7;
            margin-left: auto;
        }

        .hero-buttons {
            display: flex;
            justify-content: flex-end; /* ബട്ടണുകൾ വലതുവശത്താക്കാൻ */
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn-primary, .btn-outline {
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #0b5ed7;
            color: white;
            border: 2px solid #0b5ed7;
            box-shadow: 0 4px 15px rgba(11, 94, 215, 0.3);
        }
        .btn-primary:hover {
            background: #084298;
            border-color: #084298;
            transform: translateY(-3px);
        }

        .btn-outline {
            background: transparent;
            color: white;
            border: 2px solid white;
        }
        .btn-outline:hover {
            background: white;
            color: #0f172a;
            transform: translateY(-3px);
        }

        /* മൊബൈൽ ഫോണിൽ കാണുമ്പോൾ ഉള്ള ഡിസൈൻ മാറ്റങ്ങൾ */
        @media (max-width: 768px) {
            .hero {
                justify-content: center;
                background-position: center;
            }
            /* മൊബൈലിൽ ഗ്രേഡിയന്റ് താഴെ നിന്നും മുകളിലേക്ക് ആകുന്നു */
            .hero::before {
                background: linear-gradient(to top, rgba(15, 23, 42, 0.95) 0%, rgba(15, 23, 42, 0.6) 50%, rgba(15, 23, 42, 0.1) 100%);
            }
            .hero-content {
                text-align: center;
                margin-top: 150px;
            }
            .hero-buttons {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    
    <!-- Header -->
    <header class="site-header">
        <div class="container navbar">
            <a href="index.html" class="brand">
                <img src="images/logo.jpg" alt="Star Agencies Logo">
                <span>STAR AGENCIES</span>
            </a>
            <button class="menu-toggle" aria-label="Open menu">☰</button>
            <nav class="nav-links">
                <a href="index.html" class="active">Home</a>
                <a href="products.html">Products</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Modern Right-Aligned Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <span class="hero-subtitle">For your needs only with</span>
            <h1 class="hero-title">Beauty & <span class="highlight">Quality</span></h1>
            <p class="hero-desc">Explore our wide range of high-quality household, cleaning, plastic, and hardware products at the best prices.</p>
            <div class="hero-buttons">
                <a href="products.html" class="btn-primary">View Products</a>
                <a href="contact.html" class="btn-outline">Contact Us</a>
            </div>
        </div>
    </section>

    <!-- നിങ്ങളുടെ ബാക്കി സെക്ഷനുകൾ ഇവിടെ നൽകാം (ഉദാഹരണത്തിന് കാറ്റഗറികൾ, ഫൂട്ടർ മുതലായവ) -->
    
    <script src="js/script.js"></script>
</body>
</html>
