<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Star Agencies</title>
    
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ===================================================
           CORPORATE THEME - CENTURY GOTHIC FONT
           =================================================== */
        body {
            font-family: 'Century Gothic', 'Tw Cen MT', sans-serif !important;
            background-color: #f8fafc;
            color: #333333;
            margin: 0;
        }

        .brand span {
            font-family: 'Century Gothic', 'Tw Cen MT', sans-serif !important;
            font-weight: bold !important;
            letter-spacing: 1px !important;
            color: #1d4e73 !important; 
        }

        /* Clean White Header */
        .site-header {
            background: #ffffff !important;
            border-bottom: 1px solid #eaeaea;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            height: 75px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .nav-links a {
            color: #4a4a4a !important;
            font-size: 13px;
            font-weight: 600;
            margin-left: 30px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-decoration: none;
            padding-bottom: 5px;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #1d4e73 !important;
            border-bottom: 2px solid #d97706; /* സ്വർണ്ണ നിറത്തിലുള്ള ചെറിയ അണ്ടർലൈൻ */
        }

        /* ===================================================
           TRANSPARENT GLASSMORPHISM HERO SECTION
           =================================================== */
        .hero {
            /* നിങ്ങളുടെ കടയുടെയോ നല്ലൊരു കെട്ടിടത്തിന്റെയോ ചിത്രം നൽകുക */
            background-image: url('images/hero-bg.jpg'); 
            background-size: cover;
            background-position: center;
            height: 100vh;
            min-height: 600px;
            display: flex;
            align-items: stretch;
            padding-top: 75px; /* Header Offset */
        }

        .hero-overlay-box {
            /* ഇവിടെയാണ് പ്രധാന മാറ്റം - Transparent Glass Effect */
            background-color: rgba(29, 78, 115, 0.45); /* നിറം ട്രാൻസ്പരന്റ് ആക്കി */
            backdrop-filter: blur(10px); /* പുറകിലെ ഇമേജിന് ഒരു ഗ്ലാസ്സ് ബ്ലർ എഫക്റ്റ് */
            -webkit-backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.15); /* ഗ്ലാസ്സിന്റെ ബോർഡർ ലുക്ക് */
            
            width: 50%;
            max-width: 650px;
            padding: 0 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: white;
            text-align: left;
        }

        /* അക്ഷരങ്ങൾ ട്രാൻസ്പരന്റ് ബാക്ക്ഗ്രൗണ്ടിൽ ക്ലിയർ ആയി കാണാൻ ചെറിയ ഷാഡോ */
        .hero-title {
            font-size: clamp(36px, 4.5vw, 52px);
            margin: 0 0 20px 0;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
        }

        .hero-desc {
            font-size: 16px;
            color: #ffffff;
            margin: 0 0 40px 0;
            line-height: 1.7;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.5);
            font-weight: 500;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* Sharp Corporate Buttons */
        .btn-primary {
            background-color: #ffffff; 
            color: #1d4e73 !important;
            padding: 14px 30px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        .btn-primary:hover {
            background-color: #f1f5f9;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-outline {
            background-color: rgba(255, 255, 255, 0.1); 
            color: #ffffff !important;
            border: 2px solid #ffffff;
            padding: 12px 30px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            transition: 0.3s;
            backdrop-filter: blur(5px);
            border-radius: 4px;
        }
        .btn-outline:hover {
            background-color: #ffffff;
            color: #1d4e73 !important;
        }

        @media (max-width: 900px) {
            .hero-overlay-box { width: 65%; padding: 0 40px; }
        }
        @media (max-width: 768px) {
            .hero { align-items: flex-end; }
            .hero-overlay-box { 
                width: 100%; max-width: 100%; height: auto; padding: 50px 30px; 
                background-color: rgba(29, 78, 115, 0.75); /* മൊബൈലിൽ അക്ഷരം കാണാൻ ലേശം ഡാർക്ക് ആക്കി */
                border-right: none;
                border-top: 1px solid rgba(255, 255, 255, 0.15);
            }
            .hero-title { font-size: 32px; }
        }
    </style>
</head>
<body>
    
    <header class="site-header">
        <div class="container navbar">
            <a href="index.html" class="brand">
                <img src="images/logo.jpg" alt="Star Agencies Logo">
                <span>STAR AGENCIES</span>
            </a>
            <button class="menu-toggle" aria-label="Open menu">☰</button>
            <nav class="nav-links">
                <a href="index.html" class="active">HOME</a>
                <a href="products.html">PRODUCTS</a>
                <a href="about.html">ABOUT</a>
                <a href="contact.html">CONTACT</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-overlay-box">
                <h1 class="hero-title">Premium Quality Products</h1>
                <p class="hero-desc">Providing the best quality household, cleaning, plastic, hardware, and stationery items for your everyday needs at competitive prices.</p>
                
                <div class="hero-buttons">
                    <a href="products.html" class="btn-primary">OUR CATALOGUE</a>
                    <a href="contact.html" class="btn-outline">CONTACT US</a>
                </div>
            </div>
        </section>
    </main>
    
    <script src="js/script.js"></script>
</body>
</html>
