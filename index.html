<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Star Agencies</title>
    
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ===================================================
           CORPORATE THEME - CENTURY GOTHIC FONT
           =================================================== */
        body {
            font-family: 'Century Gothic', 'Tw Cen MT', sans-serif !important;
            background-color: #f8fafc;
            color: #333333;
            margin: 0;
        }

        .brand span {
            font-family: 'Century Gothic', 'Tw Cen MT', sans-serif !important;
            font-weight: bold !important;
            letter-spacing: 1px !important;
            color: #1d4e73 !important; /* Theme Blue */
        }

        /* Clean White Header */
        .site-header {
            background: #ffffff !important;
            border-bottom: 1px solid #eaeaea;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            height: 75px;
            display: flex;
            align-items: center;
        }
        .nav-links a {
            color: #4a4a4a !important;
            font-size: 13px;
            font-weight: 600;
            margin-left: 30px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-decoration: none;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #1d4e73 !important;
        }

        /* ===================================================
           SIDE OVERLAY HERO SECTION (LIKE 2ND IMAGE)
           =================================================== */
        .hero {
            /* നിങ്ങളുടെ കടയുടെയോ നല്ലൊരു കെട്ടിടത്തിന്റെയോ ചിത്രം നൽകുക */
            background-image: url('images/hero-bg.jpg'); 
            background-size: cover;
            background-position: center;
            height: 100vh;
            min-height: 600px;
            display: flex;
            align-items: stretch; /* മുകളിൽ നിന്നും താഴെ വരെ ബ്ലോക്ക് വരാൻ */
            padding-top: 75px; /* Header Offset */
        }

        .hero-overlay-box {
            background-color: rgba(29, 78, 115, 0.92); /* Corporate Slate Blue Color */
            width: 45%;
            max-width: 650px;
            padding: 0 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: white;
            text-align: left;
        }

        .hero-title {
            font-size: clamp(36px, 4.5vw, 52px);
            margin: 0 0 20px 0;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .hero-desc {
            font-size: 16px;
            color: #e2e8f0;
            margin: 0 0 40px 0;
            line-height: 1.7;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* Sharp Corporate Buttons */
        .btn-primary {
            background-color: #ffffff; 
            color: #1d4e73 !important;
            padding: 14px 30px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn-primary:hover {
            background-color: #f1f5f9;
        }

        .btn-outline {
            background-color: transparent; 
            color: #ffffff !important;
            border: 2px solid #ffffff;
            padding: 12px 30px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn-outline:hover {
            background-color: #ffffff;
            color: #1d4e73 !important;
        }

        @media (max-width: 900px) {
            .hero-overlay-box { width: 60%; padding: 0 40px; }
        }
        @media (max-width: 768px) {
            .hero { align-items: flex-end; }
            .hero-overlay-box { width: 100%; max-width: 100%; height: auto; padding: 50px 30px; background-color: rgba(29, 78, 115, 0.98); }
            .hero-title { font-size: 32px; }
        }
    </style>
</head>
<body>
    
    <header class="site-header">
        <div class="container navbar">
            <a href="index.html" class="brand">
                <img src="images/logo.jpg" alt="Star Agencies Logo">
                <span>STAR AGENCIES</span>
            </a>
            <button class="menu-toggle" aria-label="Open menu">☰</button>
            <nav class="nav-links">
                <a href="index.html" class="active">Home</a>
                <a href="products.html">Products</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-overlay-box">
                <h1 class="hero-title">Premium Quality Products</h1>
                <p class="hero-desc">Providing the best quality household, cleaning, plastic, hardware, and stationery items for your everyday needs at competitive prices.</p>
                
                <div class="hero-buttons">
                    <a href="products.html" class="btn-primary">Our Catalogue</a>
                    <a href="contact.html" class="btn-outline">Contact Us</a>
                </div>
            </div>
        </section>
    </main>
    
    <script src="js/script.js"></script>
</body>
</html>
