<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit / Delete Product - Star Agencies</title>
<style>
* { box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
.container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
h1 { text-align: center; color: #0b5ed7; margin-bottom: 25px; }
label { display: block; font-weight: bold; margin-top: 15px; margin-bottom: 6px; color: #334155; }
input[type="text"], input[type="password"], select, input[type="file"] { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
button { width: 100%; padding: 14px; background: #0b5ed7; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
button:hover { background: #084298; }
button:disabled { background: #94a3b8; cursor: not-allowed; }
.btn-secondary { background: #10b981; margin-top: 15px; }
.btn-secondary:hover { background: #059669; }

.btn-danger { background: #ef4444; }
.btn-danger:hover { background: #dc2626; }
.action-buttons { display: flex; gap: 15px; margin-top: 35px; }

.brand-group { background: #e0f2fe; border: 2px solid #bae6fd; border-radius: 10px; padding: 15px; margin-top: 20px; position: relative; }
.bg-header { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
.bg-name { flex: 1; padding: 10px; border: 1px solid #7dd3fc; border-radius: 6px; font-weight: bold; font-size: 16px; color: #0369a1; }
.remove-bg-btn { background: #ef4444; width: auto; padding: 10px 15px; font-size: 13px; margin: 0; }
.remove-bg-btn:hover { background: #dc2626; }

.sizes-container { background: white; padding: 15px; border-radius: 8px; border: 1px solid #cbd5e1; }
.size-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; border-bottom: 1px dashed #e2e8f0; padding-bottom: 10px; flex-wrap: wrap; }
.sz-input { flex: 2; min-width: 120px; }
.sz-price { flex: 1; min-width: 90px; }
.sz-file { flex: 2; min-width: 150px; font-size: 12px; padding: 8px; }
.remove-sz-btn { background: #f43f5e; width: auto; padding: 8px 12px; font-size: 12px; margin: 0; }

.add-size-btn { background: #6366f1; width: auto; padding: 10px 15px; font-size: 14px; margin-top: 10px; }
.add-size-btn:hover { background: #4f46e5; }
.add-brand-btn { background: #3b82f6; margin-top: 25px; border: 2px dashed #93c5fd; }
.add-brand-btn:hover { background: #2563eb; }

.status { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; font-weight: bold; text-align: center; }
.success { display: block; background: #d1e7dd; color: #0f5132; }
.error { display: block; background: #f8d7da; color: #842029; }
.info { display: block; background: #cff4fc; color: #055160; }
#editForm { display: none; margin-top: 20px; padding-top: 20px; border-top: 2px solid #e2e8f0; }

#subCategoryDiv { display: none; background: #e0f2fe; padding: 15px; border-radius: 8px; border: 1px solid #bae6fd; margin-top: 15px; }
</style>
</head>
<body>

<div class="container">
    <h1>✏️ Edit or Delete Product</h1>

    <label>GitHub Token (Required)</label>
    <input type="password" id="token" placeholder="Paste your GitHub token here">
    
    <button onclick="loadProductsList()" class="btn-secondary" id="loadBtn">🔄 Load Products from GitHub</button>
    <div id="status" class="status"></div>

    <div id="editForm">
        <label>Select Product to Edit or Delete</label>
        <select id="productSelect" onchange="fillFormDetails()">
            <option value="">-- Choose a Product --</option>
        </select>

        <label>Product Name</label>
        <input type="text" id="productName">

        <label>Category</label>
        <select id="category" onchange="toggleSubCategory()">
            <option value="Aluminium & Steel">Aluminium & Steel</option>
            <option value="Plastic Products">Plastic Products</option>
            <option value="Cleaning Items">Cleaning Items</option>
            <option value="Stationery Items">Stationery Items</option>
            <option value="Hardware Items">Hardware Items</option>
        </select>

        <div id="subCategoryDiv">
            <label id="subCatLabel" style="color: #0369a1; margin-top: 0;">Sub-Category</label>
            <select id="subCategory">
                <option value="">-- Select Option --</option>
            </select>
        </div>

        <label>Main Product Image (Leave blank to keep old image)</label>
        <input type="file" id="mainImageFile" accept="image/*">

        <div style="margin-top: 30px; border-top: 2px solid #e2e8f0; padding-top: 20px;">
            <h3 style="color: #0f172a; margin-bottom: 5px;">📦 Brands & Sizes (Prices)</h3>
            <div id="brandGroupsContainer"></div>
            <button type="button" class="add-brand-btn" onclick="createBrandGroupHTML()">+ Add Brand</button>
        </div>

        <div class="action-buttons">
            <button id="updateButton" onclick="updateProduct()" style="flex: 1;">✅ Save Changes</button>
            <button id="deleteButton" class="btn-danger" onclick="deleteProduct()" style="flex: 1;">🗑️ Delete Product</button>
        </div>
    </div>
</div>

<script>
const OWNER = "staragnctml"; const REPO = "star-agencies"; const BRANCH = "main"; const PRODUCTS_FILE = "data/products.json"; const IMAGE_FOLDER = "images/products";
let allProducts = []; let productsFileSha = "";

function showStatus(msg, type) { const el = document.getElementById("status"); el.className = "status " + type; el.innerHTML = msg; el.style.display = "block"; }

function toggleSubCategory() { 
    const cat = document.getElementById("category").value; 
    const subDiv = document.getElementById("subCategoryDiv"); 
    const subSelect = document.getElementById("subCategory");
    const subLabel = document.getElementById("subCatLabel");

    subSelect.innerHTML = '<option value="">-- Select Option --</option>'; 
    
    if(cat === "Plastic Products") {
        subDiv.style.display = "block";
        subDiv.style.background = "#e0f2fe";
        subDiv.style.borderColor = "#bae6fd";
        subLabel.innerText = "Plastic Sub-Category";
        subLabel.style.color = "#0369a1";
        subSelect.innerHTML += `
            <option value="Bucket">Bucket</option>
            <option value="Basin">Basin</option>
            <option value="Drum">Drum</option>
            <option value="Container">Container</option>
            <option value="Laundry">Laundry Products</option>
            <option value="Household">Household Items</option>
        `;
    } else if (cat === "Cleaning Items") {
        subDiv.style.display = "block";
        subDiv.style.background = "#dcfce7"; 
        subDiv.style.borderColor = "#86efac";
        subLabel.innerText = "Cleaning Sub-Category";
        subLabel.style.color = "#166534";
        subSelect.innerHTML += `
            <option value="Mop">Mop</option>
            <option value="Brush">Brushes</option>
            <option value="Broom">Brooms</option>
            <option value="Disinfectant">Disinfectants</option>
        `;
    } else { 
        subDiv.style.display = "none"; 
        subSelect.value = ""; 
    } 
}

function fileToBase64(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result.split(",")[1]); reader.onerror = reject; reader.readAsDataURL(file); }); }
function textToBase64(text) { return btoa(unescape(encodeURIComponent(text))); }
function base64ToText(base64) { return decodeURIComponent(escape(atob(base64.replace(/\s/g, "")))); }
function makeFileName(name) { return name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); }

// ഇതിലാണ് മാറ്റം വരുത്തിയത് (Cache-Control ഒഴിവാക്കി)
async function githubRequest(url, options) {
    const token = document.getElementById("token").value.trim();
    if (!token) throw new Error("Please enter your GitHub Token!");
    const response = await fetch(url, { 
        ...options, 
        headers: { 
            "Accept": "application/vnd.github+json", 
            "Authorization": "Bearer " + token, 
            "X-GitHub-Api-Version": "2022-11-28", 
            ...(options.headers || {}) 
        } 
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.message || "GitHub API Error");
    return data;
}

// പുതിയ സുരക്ഷിതമായ രീതിയിലുള്ള SHA Fetching
async function fetchLatestSHA() {
    try {
        const fileData = await githubRequest(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PRODUCTS_FILE}?ref=${BRANCH}&t=${Date.now()}`, { method: "GET" });
        return fileData.sha;
    } catch(e) {
        return productsFileSha;
    }
}

async function loadProductsList() {
    const btn = document.getElementById("loadBtn");
    try {
        btn.disabled = true; btn.innerText = "⏳ Loading..."; showStatus("⏳ Fetching...", "info");
        
        const fileData = await githubRequest(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PRODUCTS_FILE}?ref=${BRANCH}&t=${Date.now()}`, { method: "GET" });
        productsFileSha = fileData.sha; 
        allProducts = JSON.parse(base64ToText(fileData.content));
        
        const select = document.getElementById("productSelect");
        select.innerHTML = '<option value="">-- Choose a Product --</option>';
        allProducts.forEach(p => { select.appendChild(new Option(`${p.name} (ID: ${p.id})`, p.id)); });
        
        document.getElementById("editForm").style.display = "block"; showStatus("✅ Loaded.", "success");
    } catch (error) { showStatus("❌ Error: " + error.message, "error"); } finally { btn.disabled = false; btn.innerText = "🔄 Load Products from GitHub"; }
}

function createBrandGroupHTML(brandName = "") {
    const container = document.getElementById("brandGroupsContainer");
    const groupId = "bg-" + Date.now() + Math.random().toString(36).substr(2, 5);
    const div = document.createElement("div"); div.className = "brand-group"; div.id = groupId;
    div.innerHTML = `
        <div class="bg-header">
            <input type="text" class="bg-name" placeholder="Brand Name (e.g. Priya)" value="${brandName}">
            <button type="button" class="remove-bg-btn" onclick="document.getElementById('${groupId}').remove()">X Remove Brand</button>
        </div>
        <div class="sizes-container" id="sizes-${groupId}"></div>
        <button type="button" class="add-size-btn" onclick="createSizeRowHTML('${groupId}')">+ Add Size</button>
    `;
    container.appendChild(div); return groupId;
}

function createSizeRowHTML(groupId, sizeLabel = "", price = "", imgPath = "") {
    const container = document.getElementById("sizes-" + groupId);
    const rowId = "sz-" + Date.now() + Math.random().toString(36).substr(2, 5);
    const div = document.createElement("div"); div.className = "size-row"; div.id = rowId;
    div.innerHTML = `
        <input type="text" class="sz-input" placeholder="Size (e.g. 650ml)" value="${sizeLabel}">
        <input type="text" class="sz-price" placeholder="Price (₹)" value="${price}">
        <input type="file" class="sz-file" accept="image/*">
        ${imgPath ? `<input type="hidden" class="sz-old-image" value="${imgPath}"><span style="font-size:10px; color:green;">(Img exists)</span>` : `<input type="hidden" class="sz-old-image" value="">`}
        <button type="button" class="remove-sz-btn" onclick="document.getElementById('${rowId}').remove()">X</button>
    `;
    container.appendChild(div);
}

function fillFormDetails() {
    const selectedId = document.getElementById("productSelect").value;
    if (!selectedId) return;
    const product = allProducts.find(p => p.id == selectedId);
    if (!product) return;

    document.getElementById("productName").value = product.name || "";
    document.getElementById("category").value = product.category || "Aluminium & Steel";
    
    toggleSubCategory(); 
    document.getElementById("subCategory").value = product.subCategory || "";
    
    document.getElementById("brandGroupsContainer").innerHTML = "";
    
    if (product.variants && product.variants.length > 0) {
        let groups = {};
        product.variants.forEach(v => {
            let lbl = v.label || v.name || "";
            let bName = "", sName = lbl;
            if (lbl.includes("-")) { let p = lbl.split("-"); bName = p[0].trim(); sName = p.slice(1).join("-").trim(); } 
            else if (product.brand) { bName = product.brand; }
            if (!groups[bName]) groups[bName] = [];
            groups[bName].push({ size: sName, price: v.price || "", image: v.image || "" });
        });
        Object.keys(groups).forEach(bName => {
            let gId = createBrandGroupHTML(bName);
            groups[bName].forEach(sz => { createSizeRowHTML(gId, sz.size, sz.price, sz.image); });
        });
    } else {
        let gId = createBrandGroupHTML(product.brand || "");
        createSizeRowHTML(gId, "Standard", product.price || "");
    }
}

async function updateProduct() {
    const btn = document.getElementById("updateButton");
    const delBtn = document.getElementById("deleteButton");
    const selectedId = document.getElementById("productSelect").value;
    if (!selectedId) { alert("Select a product!"); return; }

    try {
        btn.disabled = true; delBtn.disabled = true; showStatus("⏳ Updating...", "info");
        const index = allProducts.findIndex(p => p.id == selectedId);
        let product = allProducts[index];
        const newName = document.getElementById("productName").value.trim();
        if (!newName) throw new Error("Name cannot be empty!");

        product.name = newName;
        product.category = document.getElementById("category").value;
        product.subCategory = document.getElementById("subCategory").value;

        const mainImgFile = document.getElementById("mainImageFile").files[0];
        const mainSafeName = makeFileName(newName);
        if (mainImgFile) {
            const ext = mainImgFile.name.split(".").pop().toLowerCase();
            const mPath = `${IMAGE_FOLDER}/${mainSafeName}-${Date.now()}.${ext}`;
            await githubRequest(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${mPath}`, { method: "PUT", body: JSON.stringify({ message: `Update image`, content: await fileToBase64(mainImgFile), branch: BRANCH }) });
            product.image = mPath;
        }

        let variantsArray = []; let finalMainBrand = ""; let finalMainPrice = ""; let isFirst = true;
        const brandGroups = document.querySelectorAll('.brand-group');
        for (let i = 0; i < brandGroups.length; i++) {
            const bg = brandGroups[i];
            const brandName = bg.querySelector('.bg-name').value.trim();
            if(isFirst && brandName) finalMainBrand = brandName;
            const sizeRows = bg.querySelectorAll('.size-row');
            for (let j = 0; j < sizeRows.length; j++) {
                const sz = sizeRows[j];
                const sizeName = sz.querySelector('.sz-input').value.trim();
                const price = sz.querySelector('.sz-price').value.trim();
                const file = sz.querySelector('.sz-file').files[0];
                const oldImg = sz.querySelector('.sz-old-image').value;

                if (sizeName || price) {
                    if (isFirst) { finalMainPrice = price; isFirst = false; }
                    let fLabel = sizeName; if (brandName && sizeName) fLabel = brandName + " - " + sizeName; else if (brandName) fLabel = brandName;
                    let fImgPath = oldImg;
                    if (file) {
                        const ext = file.name.split(".").pop().toLowerCase();
                        fImgPath = `${IMAGE_FOLDER}/${mainSafeName}-${makeFileName(fLabel)}-${Date.now()}.${ext}`;
                        await githubRequest(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${fImgPath}`, { method: "PUT", body: JSON.stringify({ message: `Update variant image`, content: await fileToBase64(file), branch: BRANCH }) });
                    }
                    variantsArray.push({ label: fLabel, price: price, image: fImgPath });
                }
            }
        }
        product.variants = variantsArray; product.brand = finalMainBrand; product.price = finalMainPrice;

        showStatus("⏳ Connecting to GitHub...", "info");
        
        productsFileSha = await fetchLatestSHA();

        const putRes = await githubRequest(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PRODUCTS_FILE}`, { method: "PUT", body: JSON.stringify({ message: `Update product: ${newName}`, content: textToBase64(JSON.stringify(allProducts, null, 2)), sha: productsFileSha, branch: BRANCH }) });
        productsFileSha = putRes.content.sha; showStatus("✅ Successfully updated!", "success");
        setTimeout(() => location.reload(), 2000);
    } catch (error) { showStatus("❌ Error: " + error.message, "error"); } finally { btn.disabled = false; delBtn.disabled = false; }
}

async function deleteProduct() {
    const btn = document.getElementById("deleteButton");
    const selectedId = document.getElementById("productSelect").value;
    if (!selectedId) return;
    if (!confirm("Are you sure you want to delete this product?")) return;
    try {
        btn.disabled = true; showStatus("⏳ Deleting...", "info");
        const remaining = allProducts.filter(p => p.id != selectedId);

        productsFileSha = await fetchLatestSHA();

        const putRes = await githubRequest(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PRODUCTS_FILE}`, { method: "PUT", body: JSON.stringify({ message: `Delete product ID: ${selectedId}`, content: textToBase64(JSON.stringify(remaining, null, 2)), sha: productsFileSha, branch: BRANCH }) });
        productsFileSha = putRes.content.sha; showStatus("✅ Deleted!", "success");
        setTimeout(() => location.reload(), 2000);
    } catch (error) { showStatus("❌ Error: " + error.message, "error"); btn.disabled = false; } 
}
</script>
</body>
</html>
