<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Product - Star Agencies</title>

<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 30px; }
.container { max-width: 650px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
h1 { text-align: center; color: #064b96; margin-bottom: 25px; }
label { display: block; font-weight: bold; margin-top: 15px; margin-bottom: 6px; }
input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
button { width: 100%; padding: 13px; margin-top: 25px; background: #064b96; color: white; border: none; border-radius: 6px; font-size: 17px; cursor: pointer; }
button:hover { background: #04366d; }
button:disabled { background: #999; cursor: not-allowed; }
.btn-secondary { background: #28a745; margin-top: 15px; }
.btn-secondary:hover { background: #218838; }
.status { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; font-weight: bold; }
.success { display: block; background: #d1e7dd; color: #0f5132; }
.error { display: block; background: #f8d7da; color: #842029; }
.info { display: block; background: #cff4fc; color: #055160; }
#editForm { display: none; margin-top: 20px; padding-top: 20px; border-top: 2px dashed #ccc; }
.security { background: #e8f5e9; padding: 15px; border-radius: 6px; margin-top: 15px; font-size: 14px; }
</style>
</head>

<body>

<div class="container">

<h1>✏️ Edit Product</h1>

<label>1. GitHub Token</label>
<input type="password" id="token" placeholder="Paste your GitHub token here">

<button onclick="loadProductsList()" class="btn-secondary" id="loadBtn">
    🔄 Load Products
</button>

<div id="status" class="status"></div>

<!-- EDIT FORM (Hidden initially) -->
<div id="editForm">
    <label>2. Select Product to Edit</label>
    <select id="productSelect" onchange="fillFormDetails()">
        <option value="">-- Choose a Product --</option>
    </select>

    <label>Product Name</label>
    <input type="text" id="productName">

    <label>Brand Name (Optional)</label>
    <input type="text" id="productBrand">

    <label>Category</label>
    <select id="category">
        <option value="Plastic Products">Plastic Products</option>
        <option value="Aluminium & Steel">Aluminium & Steel</option>
        <option value="Cleaning Items">Cleaning Items</option>
        <option value="Stationery Items">Stationery Items</option>
        <option value="Hardware Items">Hardware Items</option>
        <option value="Detergents">Detergents</option>
        <option value="Floor Cleaners">Floor Cleaners</option>
        <option value="Household">Household</option>
    </select>

    <label>Price</label>
    <input type="text" id="price">

    <label>Options / Variants</label>
    <input type="text" id="variants" placeholder="Example: 2L, 3L, 5L">

    <label>Change Image? (Leave blank to keep old image)</label>
    <input type="file" id="imageFile" accept="image/*">

    <button id="updateButton" onclick="updateProduct()">
        ✅ Save Changes
    </button>
</div>

<div class="security">
🔐 <b>Security:</b><br>
Your GitHub token is used only in this browser session. It is not saved in the website.
</div>

</div>

<script>
/* GITHUB SETTINGS */
const OWNER = "staragnctml";
const REPO = "star-agencies";
const BRANCH = "main";
const PRODUCTS_FILE = "data/products.json";
const IMAGE_FOLDER = "images/products";

let allProducts = [];
let productsFileSha = "";

function showStatus(message, type) {
    const status = document.getElementById("status");
    status.className = "status " + type;
    status.innerHTML = message;
    status.style.display = "block";
}

function base64ToText(base64) {
    base64 = base64.replace(/\s/g, "");
    const binary = atob(base64);
    const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
    let text = new TextDecoder("utf-8").decode(bytes);
    text = text.replace(/^\uFEFF/, "");
    return text.trim();
}

function textToBase64(text) {
    const bytes = new TextEncoder().encode(text);
    let binary = "";
    bytes.forEach(byte => { binary += String.fromCharCode(byte); });
    return btoa(binary);
}

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => { resolve(reader.result.split(",")[1]); };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

function makeFileName(name) {
    return name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}

async function githubRequest(url, options) {
    const token = document.getElementById("token").value.trim();
    if (!token) throw new Error("Please enter your GitHub token.");
    
    const response = await fetch(url, {
        ...options,
        headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": "Bearer " + token,
            "X-GitHub-Api-Version": "2022-11-28",
            ...(options.headers || {})
        }
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.message || "GitHub request failed.");
    return data;
}

async function getGitHubFile(path) {
    const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`;
    return await githubRequest(url, { method: "GET" });
}

async function uploadGitHubFile(path, contentBase64, message, sha = null) {
    const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`;
    const body = { message: message, content: contentBase64, branch: BRANCH };
    if (sha) body.sha = sha;
    return await githubRequest(url, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
    });
}

/* LOAD PRODUCTS LIST */
async function loadProductsList() {
    const btn = document.getElementById("loadBtn");
    try {
        btn.disabled = true;
        btn.innerText = "⏳ Loading Products...";
        showStatus("⏳ Fetching products from GitHub...", "info");

        const fileData = await getGitHubFile(PRODUCTS_FILE);
        productsFileSha = fileData.sha;
        
        const rawContent = fileData.content || "";
        const cleanBase64 = rawContent.replace(/\s/g, "");
        const jsonText = base64ToText(cleanBase64);
        
        allProducts = JSON.parse(jsonText);
        
        const select = document.getElementById("productSelect");
        select.innerHTML = '<option value="">-- Choose a Product --</option>';
        
        allProducts.forEach(p => {
            const opt = document.createElement("option");
            opt.value = p.id;
            opt.innerText = `${p.name} (ID: ${p.id})`;
            select.appendChild(opt);
        });

        document.getElementById("editForm").style.display = "block";
        showStatus("✅ Products loaded. Please select a product to edit.", "success");
    } catch (error) {
        showStatus("❌ Error: " + error.message, "error");
    } finally {
        btn.disabled = false;
        btn.innerText = "🔄 Load Products";
    }
}

/* FILL FORM DETAILS */
function fillFormDetails() {
    const selectedId = document.getElementById("productSelect").value;
    if (!selectedId) return;

    const product = allProducts.find(p => p.id == selectedId);
    if (!product) return;

    document.getElementById("productName").value = product.name || "";
    document.getElementById("productBrand").value = product.brand || "";
    document.getElementById("category").value = product.category || "Household";
    document.getElementById("price").value = product.price || "";
    
    if (product.variants && product.variants.length > 0) {
        document.getElementById("variants").value = product.variants.map(v => v.label).join(", ");
    } else {
        document.getElementById("variants").value = "";
    }
}

/* UPDATE PRODUCT */
async function updateProduct() {
    const btn = document.getElementById("updateButton");
    const selectedId = document.getElementById("productSelect").value;

    if (!selectedId) {
        alert("Please select a product to edit!");
        return;
    }

    try {
        btn.disabled = true;
        btn.innerText = "⏳ Saving Changes...";

        // Find product index
        const index = allProducts.findIndex(p => p.id == selectedId);
        if (index === -1) throw new Error("Product not found in array.");

        let product = allProducts[index];

        product.name = document.getElementById("productName").value.trim();
        product.brand = document.getElementById("productBrand").value.trim();
        product.category = document.getElementById("category").value;
        product.price = document.getElementById("price").value.trim() || "Contact Us";

        const varText = document.getElementById("variants").value.trim();
        if (varText) {
            product.variants = varText.split(",").map(v => ({ label: v.trim() })).filter(v => v.label !== "");
        } else {
            product.variants = [];
        }

        /* Check for new image */
        const imageFile = document.getElementById("imageFile").files[0];
        if (imageFile) {
            showStatus("⏳ Uploading new image...", "info");
            const ext = imageFile.name.split(".").pop().toLowerCase();
            const safeName = makeFileName(product.name);
            const imagePath = IMAGE_FOLDER + "/" + safeName + "-" + Date.now() + "." + ext;
            const imageBase64 = await fileToBase64(imageFile);
            
            await uploadGitHubFile(imagePath, imageBase64, "Update image for: " + product.name);
            product.image = imagePath; // Update image path
        }

        showStatus("⏳ Updating products.json...", "info");
        const newJson = JSON.stringify(allProducts, null, 2);
        const jsonBase64 = textToBase64(newJson);

        await uploadGitHubFile(PRODUCTS_FILE, jsonBase64, "Updated product: " + product.name, productsFileSha);

        showStatus("✅ Product details updated successfully! Changes will appear on the website shortly.", "success");
        
    } catch (error) {
        showStatus("❌ Error: " + error.message, "error");
    } finally {
        btn.disabled = false;
        btn.innerText = "✅ Save Changes";
    }
}
</script>

</body>
</html>
