<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Product - Star Agencies</title>
<style>
* { box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
.container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
h1 { text-align: center; color: #0b5ed7; margin-bottom: 25px; }
label { display: block; font-weight: bold; margin-top: 15px; margin-bottom: 6px; color: #334155; }
input[type="text"], input[type="password"], select, input[type="file"] { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
button { width: 100%; padding: 14px; margin-top: 25px; background: #0b5ed7; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
button:hover { background: #084298; }
button:disabled { background: #94a3b8; cursor: not-allowed; }
.btn-secondary { background: #10b981; margin-top: 15px; }
.btn-secondary:hover { background: #059669; }

.variants-container { margin-top: 20px; padding: 15px; border: 2px dashed #cbd5e1; border-radius: 8px; background: #f8fafc; }
.variant-row { background: #ffffff; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; margin-bottom: 15px; position: relative; }
.variant-row h4 { margin: 0 0 10px 0; color: #0f172a; font-size: 15px; }
.remove-btn { position: absolute; top: 10px; right: 10px; background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; width: auto; margin: 0; }
.remove-btn:hover { background: #dc2626; }
.add-variant-btn { background: #6366f1; margin-top: 10px; }
.add-variant-btn:hover { background: #4f46e5; }

.status { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; font-weight: bold; text-align: center; }
.success { display: block; background: #d1e7dd; color: #0f5132; }
.error { display: block; background: #f8d7da; color: #842029; }
.info { display: block; background: #cff4fc; color: #055160; }
#editForm { display: none; margin-top: 20px; padding-top: 20px; border-top: 2px solid #e2e8f0; }
.security { background: #fffbeb; padding: 15px; border-radius: 6px; margin-top: 20px; font-size: 13px; color: #92400e; border: 1px solid #fde68a; }
</style>
</head>
<body>

<div class="container">
    <h1>✏️ Edit Product</h1>

    <label>GitHub Token (Required)</label>
    <input type="password" id="token" placeholder="Paste your GitHub token here">

    <button onclick="loadProductsList()" class="btn-secondary" id="loadBtn">🔄 Load Products from GitHub</button>

    <div id="status" class="status"></div>

    <div id="editForm">
        <label>Select Product to Edit</label>
        <select id="productSelect" onchange="fillFormDetails()">
            <option value="">-- Choose a Product --</option>
        </select>

        <label>Product Name (Main)</label>
        <input type="text" id="productName">

        <label>Brand (Optional)</label>
        <input type="text" id="productBrand">

        <label>Category</label>
        <select id="category">
            <option value="Aluminium & Steel">Aluminium & Steel</option>
            <option value="Plastic Products">Plastic Products</option>
            <option value="Cleaning Items">Cleaning Items</option>
            <option value="Stationery Items">Stationery Items</option>
            <option value="Hardware Items">Hardware Items</option>
            <option value="Detergents">Detergents</option>
            <option value="Floor Cleaners">Floor Cleaners</option>
            <option value="Household">Household</option>
        </select>

        <label>Main Price (Default)</label>
        <input type="text" id="price">

        <label>Main Product Image (Leave blank to keep old image)</label>
        <input type="file" id="mainImageFile" accept="image/*">

        <div class="variants-container">
            <h3 style="margin-top:0; color: #334155;">✨ Product Options / Sizes</h3>
            <p style="font-size: 13px; color: #64748b; margin-top: -10px;">Edit options/sizes and their specific images.</p>
            
            <div id="variantsList"></div>

            <button type="button" class="add-variant-btn" onclick="addVariantRow('', '', '')">+ Add New Option</button>
        </div>

        <button id="updateButton" onclick="updateProduct()">✅ Save Changes to Website</button>
    </div>

    <div class="security">
        🔒 <b>Security Note:</b> Your token is strictly used in your browser to connect to your GitHub. It is never saved anywhere else.
    </div>
</div>

<script>
const OWNER = "staragnctml";
const REPO = "star-agencies";
const BRANCH = "main";
const PRODUCTS_FILE = "data/products.json";
const IMAGE_FOLDER = "images/products";

let allProducts = [];
let productsFileSha = "";

function showStatus(msg, type) {
    const el = document.getElementById("status");
    el.className = "status " + type;
    el.innerHTML = msg;
    el.style.display = "block";
}

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

function textToBase64(text) {
    return btoa(unescape(encodeURIComponent(text)));
}

function base64ToText(base64) {
    return decodeURIComponent(escape(atob(base64.replace(/\s/g, ""))));
}

function makeFileName(name) {
    return name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}

async function githubRequest(url, options) {
    const token = document.getElementById("token").value.trim();
    if (!token) throw new Error("Please enter your GitHub Token!");
    
    const response = await fetch(url, {
        ...options,
        headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": "Bearer " + token,
            "X-GitHub-Api-Version": "2022-11-28",
            ...(options.headers || {})
        }
    });
    
    const data = await response.json();
    if (!response.ok) throw new Error(data.message || "GitHub API Error");
    return data;
}

async function loadProductsList() {
    const btn = document.getElementById("loadBtn");
    try {
        btn.disabled = true;
        btn.innerText = "⏳ Loading Products...";
        showStatus("⏳ Fetching products from GitHub...", "info");

        const fileData = await githubRequest(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PRODUCTS_FILE}?ref=${BRANCH}`, { method: "GET" });
        productsFileSha = fileData.sha;
        
        allProducts = JSON.parse(base64ToText(fileData.content));
        
        const select = document.getElementById("productSelect");
        select.innerHTML = '<option value="">-- Choose a Product --</option>';
        
        allProducts.forEach(p => {
            const opt = document.createElement("option");
            opt.value = p.id;
            opt.innerText = `${p.name} (ID: ${p.id})`;
            select.appendChild(opt);
        });

        document.getElementById("editForm").style.display = "block";
        showStatus("✅ Products loaded successfully. Select a product below.", "success");
    } catch (error) {
        showStatus("❌ Error: " + error.message, "error");
    } finally {
        btn.disabled = false;
        btn.innerText = "🔄 Load Products from GitHub";
    }
}

function addVariantRow(label = "", price = "", imagePath = "") {
    const container = document.getElementById("variantsList");
    const rowId = "var-row-" + Date.now() + Math.random().toString(36).substring(2, 7);
    const row = document.createElement("div");
    row.className = "variant-row";
    row.id = rowId;
    
    row.innerHTML = `
        <button type="button" class="remove-btn" onclick="document.getElementById('${rowId}').remove()">X Remove</button>
        <h4>Option</h4>
        <label>Option Name/Size</label>
        <input type="text" class="v-label" value="${label}" placeholder="e.g., 3L Induction Base">
        
        <label>Price for this Option</label>
        <input type="text" class="v-price" value="${price}" placeholder="e.g., 1500">
        
        <label>Specific Image ${imagePath ? '(Current exists: ' + imagePath.split('/').pop() + ')' : ''}</label>
        <input type="file" class="v-image" accept="image/*">
        <input type="hidden" class="v-old-image" value="${imagePath}">
    `;
    container.appendChild(row);
}

function fillFormDetails() {
    const selectedId = document.getElementById("productSelect").value;
    if (!selectedId) return;

    const product = allProducts.find(p => p.id == selectedId);
    if (!product) return;

    document.getElementById("productName").value = product.name || "";
    document.getElementById("productBrand").value = product.brand || "";
    document.getElementById("category").value = product.category || "Aluminium & Steel";
    document.getElementById("price").value = product.price || "";
    
    const container = document.getElementById("variantsList");
    container.innerHTML = "";

    if (product.variants && product.variants.length > 0) {
        product.variants.forEach(v => {
            let label = v.label || "";
            let price = v.price || "";
            
            if (!v.price && label.includes('=')) {
                let parts = label.split('=');
                label = parts[0].trim();
                price = parts[1].trim();
            } else if (!v.price && label.includes(':')) {
                let parts = label.split(':');
                label = parts[0].trim();
                price = parts[1].trim();
            }

            addVariantRow(label, price, v.image || "");
        });
    }
}

async function updateProduct() {
    const btn = document.getElementById("updateButton");
    const selectedId = document.getElementById("productSelect").value;

    if (!selectedId) {
        alert("Please select a product to edit!");
        return;
    }

    try {
        btn.disabled = true;
        showStatus("⏳ Updating product details...", "info");

        const index = allProducts.findIndex(p => p.id == selectedId);
        if (index === -1) throw new Error("Product not found.");

        let product = allProducts[index];
        const newName = document.getElementById("productName").value.trim();
        if (!newName) throw new Error("Product Name cannot be empty!");

        product.name = newName;
        product.brand = document.getElementById("productBrand").value.trim();
        product.category = document.getElementById("category").value;
        product.price = document.getElementById("price").value.trim();

        const mainImgFile = document.getElementById("mainImageFile").files[0];
        const mainSafeName = makeFileName(newName);

        if (mainImgFile) {
            showStatus("⏳ Uploading new main image...", "info");
            const ext = mainImgFile.name.split(".").pop().toLowerCase();
            const mainImagePath = `${IMAGE_FOLDER}/${mainSafeName}-${Date.now()}.${ext}`;
            const base64Img = await fileToBase64(mainImgFile);

            await githubRequest(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${mainImagePath}`, {
                method: "PUT",
                body: JSON.stringify({ message: `Update main image for ${newName}`, content: base64Img, branch: BRANCH })
            });
            product.image = mainImagePath;
        }

        const variantRows = document.querySelectorAll('.variant-row');
        let variantsArray = [];

        for (let i = 0; i < variantRows.length; i++) {
            const row = variantRows[i];
            const vLabel = row.querySelector('.v-label').value.trim();
            const vPrice = row.querySelector('.v-price').value.trim();
            const vImgFile = row.querySelector('.v-image').files[0];
            const oldImgPath = row.querySelector('.v-old-image').value;

            if (vLabel) {
                let finalImgPath = oldImgPath;

                if (vImgFile) {
                    showStatus(`⏳ Uploading image for option '${vLabel}'...`, "info");
                    const ext = vImgFile.name.split(".").pop().toLowerCase();
                    const vSafeName = makeFileName(vLabel);
                    finalImgPath = `${IMAGE_FOLDER}/${mainSafeName}-${vSafeName}-${Date.now()}.${ext}`;
                    const base64VImg = await fileToBase64(vImgFile);

                    await githubRequest(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${finalImgPath}`, {
                        method: "PUT",
                        body: JSON.stringify({ message: `Update variant image: ${vLabel}`, content: base64VImg, branch: BRANCH })
                    });
                }

                variantsArray.push({
                    label: vLabel,
                    price: vPrice,
                    image: finalImgPath
                });
            }
        }

        product.variants = variantsArray;

        showStatus("⏳ Saving to GitHub...", "info");
        const updatedJson = JSON.stringify(allProducts, null, 2);

        const putRes = await githubRequest(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PRODUCTS_FILE}`, {
            method: "PUT",
            body: JSON.stringify({
                message: `Update product: ${newName}`,
                content: textToBase64(updatedJson),
                sha: productsFileSha,
                branch: BRANCH
            })
        });

        productsFileSha = putRes.content.sha;
        showStatus("✅ Product successfully updated! Changes will reflect on the website shortly.", "success");

    } catch (error) {
        showStatus("❌ Error: " + error.message, "error");
    } finally {
        btn.disabled = false;
    }
}
</script>
</body>
</html>
