<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product - Star Agencies</title>
<style>
* { box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
.container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
h1 { text-align: center; color: #0b5ed7; margin-bottom: 25px; }
label { display: block; font-weight: bold; margin-top: 15px; margin-bottom: 6px; color: #334155; }
input[type="text"], input[type="password"], select, input[type="file"] { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
button { width: 100%; padding: 14px; margin-top: 25px; background: #0b5ed7; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
button:hover { background: #084298; }
button:disabled { background: #94a3b8; cursor: not-allowed; }

/* Variants Section Styles */
.variants-container { margin-top: 20px; padding: 15px; border: 2px dashed #cbd5e1; border-radius: 8px; background: #f8fafc; }
.variant-row { background: #ffffff; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; margin-bottom: 15px; position: relative; }
.variant-row h4 { margin: 0 0 10px 0; color: #0f172a; font-size: 15px; }
.remove-btn { position: absolute; top: 10px; right: 10px; background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; width: auto; margin: 0; }
.remove-btn:hover { background: #dc2626; }
.add-variant-btn { background: #10b981; margin-top: 10px; }
.add-variant-btn:hover { background: #059669; }

.status { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; font-weight: bold; text-align: center; }
.success { display: block; background: #d1e7dd; color: #0f5132; }
.error { display: block; background: #f8d7da; color: #842029; }
.info { display: block; background: #cff4fc; color: #055160; }
.security { background: #fffbeb; padding: 15px; border-radius: 6px; margin-top: 20px; font-size: 13px; color: #92400e; border: 1px solid #fde68a; }
</style>
</head>
<body>

<div class="container">
    <h1>📦 Add New Product</h1>

    <label>GitHub Token (Required)</label>
    <input type="password" id="token" placeholder="Paste your GitHub token here">

    <label>Product Name (Main)</label>
    <input type="text" id="name" placeholder="e.g., Pressure Cooker">

    <label>Brand (Optional)</label>
    <input type="text" id="brand" placeholder="e.g., Ultix">

    <label>Category</label>
    <select id="category">
        <option value="Aluminium & Steel">Aluminium & Steel</option>
        <option value="Plastic Products">Plastic Products</option>
        <option value="Cleaning Items">Cleaning Items</option>
        <option value="Stationery Items">Stationery Items</option>
        <option value="Hardware Items">Hardware Items</option>
        <option value="Detergents">Detergents</option>
        <option value="Floor Cleaners">Floor Cleaners</option>
        <option value="Household">Household</option>
    </select>

    <label>Main Price (Default)</label>
    <input type="text" id="price" placeholder="e.g., 1200 or Contact Us">

    <label>Main Product Image</label>
    <input type="file" id="mainImage" accept="image/*">

    <!-- OPTIONS / VARIANTS SECTION -->
    <div class="variants-container">
        <h3 style="margin-top:0; color: #334155;">✨ Product Options / Sizes</h3>
        <p style="font-size: 13px; color: #64748b; margin-top: -10px;">Add different sizes or models (e.g., 2L, 3L Induction). You can upload a specific photo for each.</p>
        
        <div id="variantsList">
            <!-- Variant rows will be added here -->
        </div>

        <button type="button" class="add-variant-btn" onclick="addVariantRow()">+ Add New Option</button>
    </div>

    <button id="submitBtn" onclick="saveProduct()">🚀 Upload Product to Website</button>
    <div id="status" class="status"></div>

    <div class="security">
        🔒 <b>Security Note:</b> Your token is strictly used in your browser to connect to your GitHub. It is never saved anywhere else.
    </div>
</div>

<script>
// GitHub Repo Details
const OWNER = "staragnctml";
const REPO = "star-agencies";
const BRANCH = "main";
const PRODUCTS_FILE = "data/products.json";
const IMAGE_FOLDER = "images/products";

let variantCount = 0;

// Add a new variant row to the form
function addVariantRow() {
    variantCount++;
    const container = document.getElementById("variantsList");
    const row = document.createElement("div");
    row.className = "variant-row";
    row.id = `var-row-${variantCount}`;
    
    row.innerHTML = `
        <button type="button" class="remove-btn" onclick="removeVariantRow('${row.id}')">X Remove</button>
        <h4>Option ${variantCount}</h4>
        <label>Option Name/Size</label>
        <input type="text" class="v-label" placeholder="e.g., 3L Induction Base">
        
        <label>Price for this Option</label>
        <input type="text" class="v-price" placeholder="e.g., 1500">
        
        <label>Specific Image for this Option (Optional)</label>
        <input type="file" class="v-image" accept="image/*">
    `;
    container.appendChild(row);
}

// Remove a variant row
function removeVariantRow(rowId) {
    document.getElementById(rowId).remove();
}

// Base64 Conversion
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

function textToBase64(text) {
    return btoa(unescape(encodeURIComponent(text)));
}

function base64ToText(base64) {
    return decodeURIComponent(escape(atob(base64.replace(/\s/g, ""))));
}

function makeFileName(name) {
    return name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}

function showStatus(msg, type) {
    const el = document.getElementById("status");
    el.className = "status " + type;
    el.innerHTML = msg;
    el.style.display = "block";
}

// GitHub API Request
async function githubRequest(url, options) {
    const token = document.getElementById("token").value.trim();
    if (!token) throw new Error("Please enter your GitHub Token!");
    
    const response = await fetch(url, {
        ...options,
        headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": "Bearer " + token,
            "X-GitHub-Api-Version": "2022-11-28",
            ...(options.headers || {})
        }
    });
    
    const data = await response.json();
    if (!response.ok) throw new Error(data.message || "GitHub API Error");
    return data;
}

// Save Product Logic
async function saveProduct() {
    const btn = document.getElementById("submitBtn");
    try {
        btn.disabled = true;
        
        const name = document.getElementById("name").value.trim();
        const mainImageFile = document.getElementById("mainImage").files[0];
        
        if (!name) throw new Error("Product Name is required!");
        if (!mainImageFile) throw new Error("Main Product Image is required!");

        showStatus("⏳ Step 1: Uploading Main Image...", "info");
        
        // 1. Upload Main Image
        const mainExt = mainImageFile.name.split(".").pop().toLowerCase();
        const mainSafeName = makeFileName(name);
        const mainImagePath = `${IMAGE_FOLDER}/${mainSafeName}-${Date.now()}.${mainExt}`;
        const mainImageBase64 = await fileToBase64(mainImageFile);
        
        await githubRequest(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${mainImagePath}`, {
            method: "PUT",
            body: JSON.stringify({
                message: `Add main image for ${name}`,
                content: mainImageBase64,
                branch: BRANCH
            })
        });

        // 2. Process Variants
        const variantElements = document.querySelectorAll('.variant-row');
        let variantsArray = [];
        
        for (let i = 0; i < variantElements.length; i++) {
            const row = variantElements[i];
            const vLabel = row.querySelector('.v-label').value.trim();
            const vPrice = row.querySelector('.v-price').value.trim();
            const vImgFile = row.querySelector('.v-image').files[0];
            
            if (vLabel) {
                let vImgPath = "";
                
                // If variant has a specific image, upload it
                if (vImgFile) {
                    showStatus(`⏳ Step 2: Uploading image for option '${vLabel}'...`, "info");
                    const vExt = vImgFile.name.split(".").pop().toLowerCase();
                    const vSafeName = makeFileName(vLabel);
                    vImgPath = `${IMAGE_FOLDER}/${mainSafeName}-${vSafeName}-${Date.now()}.${vExt}`;
                    const vImageBase64 = await fileToBase64(vImgFile);
                    
                    await githubRequest(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${vImgPath}`, {
                        method: "PUT",
                        body: JSON.stringify({
                            message: `Add variant image: ${vLabel}`,
                            content: vImageBase64,
                            branch: BRANCH
                        })
                    });
                }
                
                variantsArray.push({
                    label: vLabel,
                    price: vPrice,
                    image: vImgPath // will be empty if no specific image uploaded
                });
            }
        }

        // 3. Fetch existing products.json
        showStatus("⏳ Step 3: Updating Website Data...", "info");
        const fileData = await githubRequest(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PRODUCTS_FILE}?ref=${BRANCH}`, { method: "GET" });
        
        let allProducts = [];
        if (fileData.content) {
            allProducts = JSON.parse(base64ToText(fileData.content));
        }
        
        // 4. Create new product object
        const newProduct = {
            id: Date.now(),
            name: name,
            brand: document.getElementById("brand").value.trim(),
            category: document.getElementById("category").value,
            price: document.getElementById("price").value.trim(),
            image: mainImagePath,
            variants: variantsArray
        };
        
        allProducts.push(newProduct);
        
        // 5. Upload updated products.json
        const updatedJson = JSON.stringify(allProducts, null, 2);
        
        await githubRequest(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PRODUCTS_FILE}`, {
            method: "PUT",
            body: JSON.stringify({
                message: `Add new product: ${name} with variants`,
                content: textToBase64(updatedJson),
                sha: fileData.sha,
                branch: BRANCH
            })
        });

        showStatus("✅ Success! Product and all options added completely. It will appear on your website in a minute.", "success");
        
        // Clear form
        document.getElementById("name").value = "";
        document.getElementById("brand").value = "";
        document.getElementById("price").value = "";
        document.getElementById("mainImage").value = "";
        document.getElementById("variantsList").innerHTML = "";
        variantCount = 0;

    } catch (error) {
        showStatus("❌ Error: " + error.message, "error");
    } finally {
        btn.disabled = false;
    }
}
</script>
</body>
</html>
